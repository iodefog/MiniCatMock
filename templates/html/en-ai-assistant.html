            <!-- ─── Drawer: AI Assistant ─── -->
            <div id="ai-panel" class="mock-drawer ai-drawer">
                <div class="drawer-header" style="background: linear-gradient(135deg, #a855f7, #7e22ce); color: white;">
                    <h3 style="color: white; margin: 0; font-size: 16px;">✨ AI Mock Assistant</h3>
                    <div class="drawer-header-actions">
                        <span class="status-dot-badge" style="background: rgba(255,255,255,0.2); color: white; border: none;">
                            <span class="dot active" style="background: #10b981;"></span> Ready
                        </span>
                        <button class="btn-drawer-close" onclick="closeAIDrawer()" style="color: white; opacity: 0.8;">✕</button>
                    </div>
                </div>

                <div class="drawer-content scroll-container" style="padding: 20px;">
                            <!-- ─── AI Assistant Panel ─── -->
                            <div class="ai-assistant-panel">
                                <div class="ai-assistant-header">
                                    <div class="ai-assistant-title">
                                        <span class="ai-icon">✨</span> <span>Conversational AI</span>
                                    </div>
                                    <div class="ai-status-indicator">
                                        <span class="pulse-dot"></span> Ready
                                    </div>
                                </div>
                                
                                <div class="ai-chat-container">
                                    <div style="display:flex; gap:8px; margin-bottom:10px;">
                                        <select id="ai-nl-method" style="background: var(--surface2); border:1px solid var(--border); color: var(--text); border-radius:8px; padding:8px 10px; font-size:12px; outline:none; cursor:pointer;">
                                            <option>GET</option>
                                            <option selected>POST</option>
                                            <option>PUT</option>
                                            <option>DELETE</option>
                                            <option>PATCH</option>
                                        </select>
                                        <input type="text" id="ai-nl-path" placeholder="Endpoint path, e.g. /drama-box/sf001/list" style="flex:1; background: var(--surface2); border:1px solid var(--border); color: var(--text); border-radius:8px; padding:8px 12px; font-size:12px; outline:none; font-family:monospace;" />
                                    </div>
                                    <div class="ai-quick-chips">
                                        <button type="button" class="ai-chip" onclick="insertQuickActionPrompt('generate','ai-nl-rule-input')" >🪄 Auto Generate</button>
                                        <button type="button" class="ai-chip warning" onclick="insertQuickActionPrompt('boundary','ai-nl-rule-input')" >🦠 Inject Boundary</button>
                                        <button type="button" class="ai-chip" onclick="insertQuickActionPrompt('multilang','ai-nl-rule-input')" >🌍 UI Overflow Test</button>
                                        <button type="button" class="ai-chip" onclick="insertQuickActionPrompt('network','ai-nl-rule-input')" >🐢 Simulate 3s Latency</button>
                                        <button type="button" class="ai-chip warning" onclick="insertQuickActionPrompt('token','ai-nl-rule-input')" >🔐 Token Expired 401</button>
                                        <button type="button" class="ai-chip" onclick="insertQuickActionPrompt('reverse','ai-nl-rule-input')" >🔀 Reverse Array</button>
                                        <button type="button" class="ai-chip info" onclick="insertQuickActionPrompt('findParams','ai-nl-rule-input')" >🔎 Find Params</button>
                                        <button type="button" class="ai-chip info" onclick="insertQuickActionPrompt('modifyField','ai-nl-rule-input')" >✏️ Modify/Add Field</button>
                                        <button type="button" class="ai-chip info" onclick="insertQuickActionPrompt('findLevel','ai-nl-rule-input')" >📍 Field Level</button>
                                        <button type="button" class="ai-chip info" onclick="insertQuickActionPrompt('genRelated','ai-nl-rule-input')" >🧩 Gen Related</button>
                                        <button type="button" class="ai-chip" onclick="insertQuickActionPrompt('replay','ai-nl-rule-input')" >🔁 Re-request</button>
                                    </div>
                                    
                                    <div class="ai-input-wrapper">
                                        <textarea id="ai-nl-rule-input" class="ai-chat-textarea" placeholder="Describe rule here... e.g. "Set 2s delay" or "Change status to 502""></textarea>
                                        <button class="btn-ai-send" onclick="simulateAIRuleGen()" title="Send Command">
                                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                                            </svg>
                                        </button>
                                    </div>
                                </div>

                                <div id="ai-nl-output" style="display:none; margin-top:12px; background: var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px; font-size:12px; line-height:1.6; white-space:pre-wrap; max-height:420px; overflow:auto; font-family: monospace;"></div>
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
                                    <span id="ai-nl-output-status" style="font-size:11px; color: var(--text-muted);"></span>
                                    <button type="button" id="ai-nl-save-btn" onclick="saveDrawerAIResult()" style="display:none; padding:4px 12px; font-size:11px; border-radius:6px; border:1px solid var(--border); background: var(--surface2); color: var(--text); cursor:pointer;">💾 Save as Rule</button>
                                </div>

                            </div>

                </div>
            </div>
    <!-- AI Drawer Overlay -->
    <div id="ai-drawer-overlay" class="drawer-overlay" onclick="closeAIDrawer()" style="display: none;"></div>
    <!-- AI Pet Floating Companion -->
    <div id="ai-pet-container" class="ai-pet-container" style="display: none;">
        <!-- Speech Bubble -->
        <div class="ai-pet-bubble" id="ai-pet-bubble">
            <span id="ai-pet-bubble-text">AI diagnostic initialized, waiting for requests...</span>
        </div>
        
        <!-- Interactive Pet Wrapper -->
        <div class="ai-pet-wrapper" onclick="interactWithPet()">
            <!-- Collapse Button -->
            <button class="ai-pet-collapse-btn" onclick="togglePetCollapse(event)" title="Collapse Pet">×</button>
            <div id="ai-pet-svg-wrapper"></div>
        </div>

        <!-- Growth Stats Panel -->
        <div class="ai-pet-stats">
            <div class="stat-row">
                <span class="stat-label">Level:</span>
                <span id="ai-pet-level" class="stat-value">Lv.1 (Baby)</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Connected:</span>
                <span id="ai-pet-time" class="stat-value">0 min</span>
            </div>
            <div class="pet-growth-bar-bg">
                <div id="pet-growth-bar" class="pet-growth-bar-fg" style="width: 0%;"></div>
            </div>
        </div>
    </div>
    
    <!-- Collapsed Pet Icon -->
    <div id="ai-pet-collapsed" class="ai-pet-collapsed" onclick="expandPet()" style="display: none;">
        🐱
        <span class="badge" id="ai-pet-collapsed-level">Lv.1</span>
    </div>
<button class="scroll-top-btn" id="resp-scroll-top-btn" title="回到顶部">↑</button>
