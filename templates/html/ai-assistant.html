            <!-- ─── Drawer: AI Assistant ─── -->
            <div id="ai-panel" class="mock-drawer ai-drawer">
                <div class="drawer-header" style="background: linear-gradient(135deg, #a855f7, #7e22ce); color: white;">
                    <h3 data-i18n="ai_drawer_title" style="color: white; margin: 0; font-size: 16px;">✨ AI Mock 配置助手</h3>
                    <div class="drawer-header-actions">
                        <button class="btn-drawer-close" onclick="closeAIDrawer()" style="color: white; opacity: 0.8;">✕</button>
                    </div>
                </div>

                <div class="drawer-content scroll-container" style="padding: 20px;">
                            <!-- ─── AI Assistant Panel ─── -->
                            <div class="ai-assistant-panel">
                                <div class="ai-assistant-header">
                                    <div class="ai-assistant-title">
                                        <span class="ai-icon">✨</span> <span data-i18n="ai_assistant_title">对话式 AI 助手</span>
                                    </div>
                                </div>
                                
                                <div class="ai-chat-container">
                                    <div style="margin-bottom:10px;">
                                        <input type="text" id="ai-nl-path" placeholder="接口路径【可选】，如 /drama-box/sf001/list" style="width:100%; background: var(--surface2); border:1px solid var(--border); color: var(--text); border-radius:8px; padding:8px 12px; font-size:12px; outline:none; font-family:monospace;" />
                                    </div>
                                    <div class="ai-quick-chips">
                                        <button type="button" class="ai-chip" onclick="insertQuickActionPrompt('generate','ai-nl-rule-input')" data-i18n="ai_chip_generate">🪄 一键生成数据</button>
                                        <button type="button" class="ai-chip warning" onclick="insertQuickActionPrompt('boundary','ai-nl-rule-input')" data-i18n="ai_chip_boundary">🦠 注入边界脏数据</button>
                                        <button type="button" class="ai-chip" onclick="insertQuickActionPrompt('multilang','ai-nl-rule-input')" data-i18n="ai_chip_multilang">🌍 UI 撑破测试</button>
                                        <button type="button" class="ai-chip" onclick="insertQuickActionPrompt('network','ai-nl-rule-input')" data-i18n="ai_chip_network">🐢 模拟弱网</button>
                                        <button type="button" class="ai-chip warning" onclick="insertQuickActionPrompt('token','ai-nl-rule-input')" data-i18n="ai_chip_token">🔐 Token 失效</button>
                                        <button type="button" class="ai-chip" onclick="insertQuickActionPrompt('reverse','ai-nl-rule-input')" data-i18n="ai_chip_reverse">🔀 数据倒序</button>
                                        <button type="button" class="ai-chip info" onclick="insertQuickActionPrompt('findParams','ai-nl-rule-input')" data-i18n="ai_chip_find_params">🔎 查找接口参数</button>
                                        <button type="button" class="ai-chip info" onclick="insertQuickActionPrompt('modifyField','ai-nl-rule-input')" data-i18n="ai_chip_modify_field">✏️ 改/增字段</button>
                                        <button type="button" class="ai-chip info" onclick="insertQuickActionPrompt('findLevel','ai-nl-rule-input')" data-i18n="ai_chip_find_level">📍 字段第几层</button>
                                        <button type="button" class="ai-chip info" onclick="insertQuickActionPrompt('genRelated','ai-nl-rule-input')" data-i18n="ai_chip_gen_related">🧩 参考生成接口</button>
                                        <button type="button" class="ai-chip" onclick="insertQuickActionPrompt('replay','ai-nl-rule-input')" data-i18n="ai_chip_replay">🔁 重新请求接口</button>
                                    </div>
                                    
                                    <div class="ai-input-wrapper">
                                        <textarea id="ai-nl-rule-input" class="ai-chat-textarea" data-i18n-placeholder="ai_rule_placeholder" placeholder="在此输入您的指令... 例如：“设置 2s 延迟” 或 “将状态码改为 502”"></textarea>
                                        <button class="btn-ai-send" onclick="simulateAIRuleGen()" title="Send Command">
                                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                                            </svg>
                                        </button>
                                    </div>
                                </div>

                                <div id="ai-nl-output" style="display:none; margin-top:12px; background: var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px; font-size:12px; line-height:1.6; white-space:pre-wrap; max-height:420px; overflow:auto; font-family: monospace;"></div>
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
                                    <span id="ai-nl-output-status" style="font-size:11px; color: var(--text-muted);"></span>
                                    <button type="button" id="ai-nl-save-btn" onclick="saveDrawerAIResult()" style="display:none; padding:4px 12px; font-size:11px; border-radius:6px; border:1px solid var(--border); background: var(--surface2); color: var(--text); cursor:pointer;">💾 保存为规则</button>
                                </div>

                            </div>

                </div>
            </div>
    <!-- AI Drawer Overlay -->
    <div id="ai-drawer-overlay" class="drawer-overlay" onclick="closeAIDrawer()" style="display: none;"></div>
    <!-- AI Pet Floating Companion -->
    <div id="ai-pet-container" class="ai-pet-container" style="display: none;">
        <!-- Speech Bubble -->
        <div class="ai-pet-bubble" id="ai-pet-bubble">
            <span id="ai-pet-bubble-text">已启动智能诊断，等待请求数据...</span>
        </div>
        
        <!-- Interactive Pet Wrapper -->
        <div class="ai-pet-wrapper" onclick="interactWithPet()">
            <!-- Collapse Button -->
            <button class="ai-pet-collapse-btn" onclick="togglePetCollapse(event)" title="折叠陪伴">×</button>
            <div id="ai-pet-svg-wrapper"></div>
        </div>

        <!-- Growth Stats Panel -->
        <div class="ai-pet-stats">
            <div class="stat-row">
                <span class="stat-label">等级 (Level):</span>
                <span id="ai-pet-level" class="stat-value">Lv.1 (幼猫)</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">连接时间:</span>
                <span id="ai-pet-time" class="stat-value">0 分钟</span>
            </div>
            <div class="pet-growth-bar-bg">
                <div id="pet-growth-bar" class="pet-growth-bar-fg" style="width: 0%;"></div>
            </div>
        </div>
    </div>
    
    <!-- Collapsed Pet Icon -->
    <div id="ai-pet-collapsed" class="ai-pet-collapsed" onclick="expandPet()" style="display: none;">
        🐱
        <span class="badge" id="ai-pet-collapsed-level">Lv.1</span>
    </div>
<button class="scroll-top-btn" id="resp-scroll-top-btn" title="回到顶部">↑</button>
